name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Clippy, Tests, Docs
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check Rust and workflow currency policy
        run: bash scripts/check_toolchain_policy.sh

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Enforce Rust/Bash-only repository automation
        run: test -z "$(rg --files -g '*.py' -g '*.rb' || true)"

      - name: Validate visual cycle contract
        run: |
          bash -n scripts/visual_cycle.sh
          jq empty tests/fixtures/visual_cycle_record.schema.json
          scripts/visual_cycle.sh --help >/dev/null

      - name: Cache Cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --locked --all-targets --all-features

      - name: cargo test --doc
        run: cargo test --locked --doc --all-features

      - name: cargo bench --no-run
        run: cargo bench --locked --no-run --all-features

      - name: Source-bound Criterion benchmark
        run: |
          scripts/benchmark_gate.sh \
            --sample-size 10 \
            --receipt "$RUNNER_TEMP/termiflow-benchmark/receipt.json"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: termiflow-benchmark-${{ matrix.os }}
          path: ${{ runner.temp }}/termiflow-benchmark
          if-no-files-found: error

      - name: cargo doc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features

      - name: golden fixtures
        run: cargo test --locked --features golden

      - name: cargo build --release
        run: cargo build --locked --release

      - name: package contents
        shell: bash
        run: |
          files="$(cargo package --locked --list)"
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Eq '(^|/)(\.claude|\.agents|\.maestro|\.maestro-project|\.helix|analysis|planning|decisions|skills)(/|$)|^(AGENTS\.md|DEMO\.ts)$|^src/(qa/|bin/termiflow_qa\.rs$)'; then
            echo "internal workflow or repository-only QA files leaked into the package" >&2
            exit 1
          fi

      - name: publish dry run
        run: cargo publish --dry-run --locked

      - name: visual evidence smoke
        run: |
          scripts/visual_audit.sh \
            --styles ascii \
            --modes default \
            --out "$RUNNER_TEMP/termiflow-visual-smoke"

  visual:
    name: Full visual evidence matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Build renderer
        run: cargo build --locked --bin termiflow

      - name: Run visual evidence matrix
        run: |
          scripts/visual_audit.sh \
            --binary target/debug/termiflow \
            --styles ascii,unicode \
            --modes default,optimized \
            --out "$RUNNER_TEMP/termiflow-visual-full"

      - name: Validate visual quality baseline
        run: |
          scripts/visual_validate.sh \
            --packet "$RUNNER_TEMP/termiflow-visual-full" \
            --baseline tests/fixtures/quality_baseline.json \
            --strict-quality

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy

      - name: cargo fmt --check on MSRV
        run: cargo fmt --check

      - name: cargo clippy on MSRV
        run: cargo clippy --locked --all-targets --all-features -- -D warnings -A clippy::uninlined_format_args

      - name: cargo test on MSRV
        run: cargo test --locked --all-targets --all-features

      - name: cargo test --doc on MSRV
        run: cargo test --locked --doc --all-features

      - name: cargo doc on MSRV
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features

      - name: cargo bench --no-run on MSRV
        run: cargo bench --locked --no-run --all-features

  deny:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Install cargo-outdated
        run: cargo install cargo-outdated --version 0.19.0 --locked

      - name: Rust and dependency currency receipt
        run: |
          scripts/dependency_currency_gate.sh \
            --receipt "$RUNNER_TEMP/termiflow-dependency-currency/receipt.json"

      - name: Upload dependency currency evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: termiflow-dependency-currency
          path: ${{ runner.temp }}/termiflow-dependency-currency
          if-no-files-found: error

      - name: cargo deny check
        run: cargo deny --locked check advisories bans licenses sources

      - name: cargo audit
        run: cargo audit --deny warnings
