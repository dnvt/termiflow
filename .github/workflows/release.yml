name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  candidate:
    name: Bind release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Check Rust and workflow currency policy
        run: bash scripts/check_toolchain_policy.sh

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Prepare candidate boundary and package contract
        shell: bash
        run: |
          candidate_root="$RUNNER_TEMP/termiflow-release-candidate"
          mkdir -p "$candidate_root/package"
          scripts/release_candidate.sh prepare \
            --tag "$GITHUB_REF_NAME" \
            --boundary "$candidate_root/candidate.json"
          crate_path="$(jq -r '.package.path' "$candidate_root/candidate.json")"
          cp "$crate_path" "$candidate_root/package/"
          jq --arg path "package/$(basename "$crate_path")" \
            '.package.path=$path' \
            "$candidate_root/candidate.json" > "$candidate_root/candidate.json.tmp"
          mv "$candidate_root/candidate.json.tmp" "$candidate_root/candidate.json"

      - name: Upload candidate boundary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: termiflow-release-candidate
          path: ${{ runner.temp }}/termiflow-release-candidate
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: candidate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Download candidate boundary
        uses: actions/download-artifact@v8.0.1
        with:
          name: termiflow-release-candidate
          path: ${{ runner.temp }}/termiflow-release-candidate

      - name: Check Rust and workflow currency policy
        run: bash scripts/check_toolchain_policy.sh

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - name: Verify candidate before build
        run: |
          scripts/release_candidate.sh verify \
            --tag "$GITHUB_REF_NAME" \
            --boundary "$RUNNER_TEMP/termiflow-release-candidate/candidate.json"

      - name: Cache Cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --locked --release --target ${{ matrix.target }}
          else
            cargo build --locked --release --target ${{ matrix.target }}
          fi

      - name: Package deterministic target archive
        shell: bash
        run: |
          output_root="$RUNNER_TEMP/termiflow-release-output"
          staging="$RUNNER_TEMP/termiflow-release-staging"
          mkdir -p "$output_root" "$staging"
          cp "target/${{ matrix.target }}/release/termiflow" "$staging/"
          cp "target/${{ matrix.target }}/release/tw" "$staging/"
          cp LICENSE README.md "$staging/"
          touch -t 197001010000 "$staging/termiflow" "$staging/tw" "$staging/LICENSE" "$staging/README.md"
          archive="termiflow-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar -cf - -C "$staging" LICENSE README.md termiflow tw | gzip -n > "$output_root/$archive"
          scripts/release_candidate.sh record \
            --boundary "$RUNNER_TEMP/termiflow-release-candidate/candidate.json" \
            --target "${{ matrix.target }}" \
            --archive "$output_root/$archive" \
            --fragment "$output_root/fragment-${{ matrix.target }}.json"

      - name: Upload target archive and digest fragment
        uses: actions/upload-artifact@v7.0.1
        with:
          name: termiflow-release-${{ matrix.target }}
          path: ${{ runner.temp }}/termiflow-release-output
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Download candidate boundary
        uses: actions/download-artifact@v8.0.1
        with:
          name: termiflow-release-candidate
          path: ${{ runner.temp }}/termiflow-release-candidate

      - name: Download target artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: termiflow-release-*
          path: ${{ runner.temp }}/termiflow-release-artifacts
          merge-multiple: false

      - name: Finalize and verify candidate boundary
        shell: bash
        run: |
          candidate_root="$RUNNER_TEMP/termiflow-release-candidate"
          archives="$RUNNER_TEMP/termiflow-release-archives"
          fragments="$RUNNER_TEMP/termiflow-release-fragments"
          mkdir -p "$archives" "$fragments"
          find "$RUNNER_TEMP/termiflow-release-artifacts" -type f -name '*.tar.gz' -exec cp {} "$archives/" \;
          find "$RUNNER_TEMP/termiflow-release-artifacts" -type f -name 'fragment-*.json' -exec cp {} "$fragments/" \;
          package_path="$(find "$candidate_root/package" -type f -name '*.crate' -print -quit)"
          scripts/release_candidate.sh finalize \
            --boundary "$candidate_root/candidate.json" \
            --package "$package_path" \
            --fragments-dir "$fragments" \
            --archives-dir "$archives"
          scripts/release_preflight.sh \
            --boundary "$candidate_root/candidate.json" \
            --publish

      - name: Upload finalized candidate evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: termiflow-release-boundary
          path: ${{ runner.temp }}/termiflow-release-candidate/candidate.json
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: |
            ${{ runner.temp }}/termiflow-release-archives/*.tar.gz
            ${{ runner.temp }}/termiflow-release-candidate/candidate.json
          generate_release_notes: true
