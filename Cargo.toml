[package]
name = "termiflow"
version = "0.1.1"
edition = "2021"
description = "Terminal-native Mermaid flowchart renderer — jq for diagrams"
license = "MIT"
repository = "https://github.com/dnvt/termiflow"
homepage = "https://github.com/dnvt/termiflow"
documentation = "https://github.com/dnvt/termiflow/blob/main/docs/reference.md"
keywords = ["mermaid", "diagram", "terminal", "cli", "ascii"]
categories = ["command-line-utilities", "visualization"]
rust-version = "1.88"
default-run = "termiflow"
exclude = [
    "artifacts/",
    ".github/",
    ".gitignore",
    "src/bin/termiflow_qa.rs",
    "src/qa/",
    "tests/fixtures/",
    "tests/visual_audit.rs",
    "tests/visual_audit_runner.rs",
    "benches/",
    "scripts/",
    "docs/",
    "deny.toml",
]

[[bin]]
name = "termiflow"
path = "src/bin/termiflow.rs"

[[bin]]
name = "tw"
path = "src/bin/tw.rs"

[[bin]]
name = "termiflow-qa"
path = "src/bin/termiflow_qa.rs"
required-features = ["qa"]

[[bin]]
name = "cargo-metadata-to-graph"
path = "src/bin/cargo_metadata_to_graph.rs"

[[bin]]
name = "graph-to-mermaid"
path = "src/bin/graph_to_mermaid.rs"

[features]
golden = []
qa = []

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
regex = "1"
anyhow = "1.0"
dirs = "6"
toml = "1"
unicode-width = "0.2"
lazy_static = "1.5"
unicode-segmentation = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
criterion = "0.8"

[[bench]]
name = "rendering"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
