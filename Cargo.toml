[package]
name = "termiflow"
version = "0.2.2"
edition = "2021"
description = "Terminal-native Mermaid flowchart renderer."
license = "MIT"
repository = "https://github.com/dnvt/termiflow"
homepage = "https://termiflow.dnvt.me"
documentation = "https://github.com/dnvt/termiflow/blob/main/docs/reference.md"
keywords = ["mermaid", "diagram", "terminal", "cli", "ascii"]
categories = ["command-line-utilities", "visualization"]
rust-version = "1.88"
default-run = "termiflow"
exclude = [
    "artifacts/",
    ".github/",
    ".gitignore",
    "src/bin/termiflow_qa.rs",
    "src/qa/",
    "tests/fixtures/",
    "tests/visual_audit.rs",
    "tests/visual_audit_runner.rs",
    "benches/",
    "tests/",
    "scripts/",
    "docs/",
    "skills/",
    "deny.toml",
    ".maestro/",
    ".maestro.toml",
    ".maestro-project/",
    ".claude/",
    ".agents/",
    "AGENTS.md",
    "CLAUDE.md",
    "plugins/*/.codex-plugin/",
    "plugins/*/skills/",
    "plugins/*/AGENTS.md",
]

[[bin]]
name = "termiflow"
path = "src/bin/termiflow.rs"

[[bin]]
name = "tw"
path = "src/bin/tw.rs"

[[bin]]
name = "termiflow-qa"
path = "src/bin/termiflow_qa.rs"
required-features = ["qa"]

[[bin]]
name = "cargo-metadata-to-graph"
path = "src/bin/cargo_metadata_to_graph.rs"

[[bin]]
name = "graph-to-mermaid"
path = "src/bin/graph_to_mermaid.rs"

[[test]]
name = "qa_schema"
required-features = ["qa"]

[features]
golden = []
qa = []
# These tests intentionally exercise the repository's visual fixture corpus,
# which is excluded from the published crate. Repository CI enables this
# feature; the package contract test omits it to validate the consumer crate.
maintainer-fixtures = []

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
clap = { version = "4.6.6", features = ["derive"] }
regex = "1.13.1"
anyhow = "1.0.104"
dirs = "6.0.0"
toml = "1.1.4"
unicode-width = "0.2.2"
lazy_static = "1.5.0"
unicode-segmentation = "1.13.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
criterion = "0.8.2"

[[bench]]
name = "rendering"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
